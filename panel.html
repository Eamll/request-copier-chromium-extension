<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 12px;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    
    .hotkey-hint {
      background: #333;
      padding: 4px 8px;
      border-radius: 4px;
      color: #9cdcfe;
    }
    
    kbd {
      background: #444;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #555;
      font-family: monospace;
    }
    
    .status {
      padding: 4px 8px;
      border-radius: 4px;
      background: #2d2d2d;
    }
    
    .status.success {
      background: #1e3a1e;
      color: #4ec94e;
    }
    
    .status.error {
      background: #3a1e1e;
      color: #f48771;
    }
    
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    
    input[type="text"] {
      background: #3c3c3c;
      border: 1px solid #555;
      color: #d4d4d4;
      padding: 6px 10px;
      border-radius: 4px;
      flex: 1;
      max-width: 300px;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #007acc;
    }
    
    .requests-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 4px;
      background: #252526;
    }
    
    .request-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #333;
      cursor: pointer;
      gap: 10px;
    }
    
    .request-item:hover {
      background: #2a2d2e;
    }
    
    .request-item.selected {
      background: #094771;
    }
    
    .method {
      font-weight: bold;
      min-width: 50px;
      font-size: 11px;
    }
    
    .method.get { color: #4ec94e; }
    .method.post { color: #dcdcaa; }
    .method.put { color: #569cd6; }
    .method.patch { color: #c586c0; }
    .method.delete { color: #f48771; }
    
    .url {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #9cdcfe;
    }
    
    .status-code {
      min-width: 35px;
      text-align: right;
      font-size: 11px;
    }
    
    .status-code.success { color: #4ec94e; }
    .status-code.redirect { color: #dcdcaa; }
    .status-code.error { color: #f48771; }
    
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    
    button:hover {
      background: #1177bb;
    }
    
    button:disabled {
      background: #444;
      cursor: not-allowed;
    }
    
    button.secondary {
      background: #3c3c3c;
    }
    
    button.secondary:hover {
      background: #4c4c4c;
    }
    
    .empty-state {
      padding: 40px;
      text-align: center;
      color: #888;
    }
    
    .format-options {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    
    select {
      background: #3c3c3c;
      border: 1px solid #555;
      color: #d4d4d4;
      padding: 6px 10px;
      border-radius: 4px;
    }
    
    .graphql-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    
    .graphql-toggle:hover {
      background: #4c4c4c;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #555;
      transition: 0.3s;
      border-radius: 18px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #007acc;
    }
    
    input:checked + .slider:before {
      transform: translateX(14px);
    }
    
    input:focus + .slider {
      box-shadow: 0 0 1px #007acc;
    }
    
    .switch-label {
      cursor: pointer;
      margin: 0;
      font-size: 12px;
      color: #d4d4d4;
    }
    
    .graphql-badge {
      display: inline-block;
      background: #e10098;
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      margin-left: 4px;
    }

    /* Resource type filter bar */
    .type-filter-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .type-btn {
      background: none;
      border: 1px solid transparent;
      color: #888;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      white-space: nowrap;
    }

    .type-btn:hover {
      color: #d4d4d4;
      background: #2a2d2e;
    }

    .type-btn.active {
      color: #d4d4d4;
      background: #094771;
      border-color: #007acc;
    }

    .invert-label {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
      color: #888;
      font-size: 11px;
      cursor: pointer;
    }

    .invert-label input {
      margin: 0;
      cursor: pointer;
    }

    /* Preview panel */
    .main-split {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .main-split .requests-container {
      flex: 1;
      min-height: 80px;
    }

    .main-split.has-preview .requests-container {
      flex: 0 0 55%;
    }

    .preview-panel {
      display: none;
      flex-direction: column;
      border: 1px solid #333;
      border-radius: 4px;
      background: #252526;
      min-height: 0;
      flex: 1;
      margin-top: 4px;
    }

    .preview-panel.visible {
      display: flex;
    }

    .preview-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #2d2d2d;
      border-bottom: 1px solid #333;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 11px;
      flex-shrink: 0;
    }

    .preview-summary .method {
      font-weight: bold;
      font-size: 11px;
      min-width: auto;
    }

    .preview-summary .url {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #9cdcfe;
    }

    .preview-summary .arrow {
      color: #666;
    }

    .preview-summary .status-code {
      min-width: auto;
    }

    .preview-tabs {
      display: flex;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .preview-tab {
      padding: 5px 14px;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit;
    }

    .preview-tab:hover {
      color: #d4d4d4;
      background: #2a2d2e;
    }

    .preview-tab.active {
      color: #d4d4d4;
      border-bottom-color: #007acc;
    }

    .preview-tab .tab-badge {
      display: inline-block;
      background: #3c3c3c;
      color: #888;
      padding: 0 5px;
      border-radius: 8px;
      font-size: 10px;
      margin-left: 4px;
    }

    .preview-tab.active .tab-badge {
      background: #094771;
      color: #9cdcfe;
    }

    .preview-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .preview-body .kv-row {
      display: flex;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .preview-body .kv-key {
      color: #569cd6;
      min-width: 120px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .preview-body .kv-val {
      color: #ce9178;
      word-break: break-all;
    }

    .preview-body .kv-val.masked {
      color: #666;
      font-style: italic;
    }

    .preview-body .json-key { color: #9cdcfe; }
    .preview-body .json-string { color: #ce9178; }
    .preview-body .json-number { color: #b5cea8; }
    .preview-body .json-boolean { color: #569cd6; }
    .preview-body .json-null { color: #569cd6; }

    .preview-empty {
      color: #666;
      font-style: italic;
      padding: 12px 0;
    }

    .preview-section-label {
      color: #888;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 8px 0 4px;
    }

    .preview-section-label:first-child {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="hotkey-hint">Hotkey: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> to copy selected</span>
    <span id="status" class="status"></span>
  </div>
  
  <div class="filter-row">
    <input type="text" id="filter" placeholder="Filter requests (regex supported)...">
    <div class="graphql-toggle" onclick="document.getElementById('graphqlToggle').click()">
      <label class="switch">
        <input type="checkbox" id="graphqlToggle">
        <span class="slider"></span>
      </label>
      <label for="graphqlToggle" class="switch-label">GraphQL Only</label>
    </div>
    <div class="format-options">
      <label>
        Format:
        <select id="format">
          <option value="json">JSON</option>
          <option value="curl">cURL + Response</option>
          <option value="markdown">Markdown</option>
          <option value="graphql">GraphQL</option>
        </select>
      </label>
    </div>
  </div>
  
  <div class="type-filter-row" id="typeFilterRow">
    <button class="type-btn active" data-type="all">All</button>
    <button class="type-btn" data-type="fetch">Fetch/XHR</button>
    <button class="type-btn" data-type="document">Doc</button>
    <button class="type-btn" data-type="stylesheet">CSS</button>
    <button class="type-btn" data-type="script">JS</button>
    <button class="type-btn" data-type="font">Font</button>
    <button class="type-btn" data-type="image">Img</button>
    <button class="type-btn" data-type="media">Media</button>
    <button class="type-btn" data-type="manifest">Manifest</button>
    <button class="type-btn" data-type="websocket">Socket</button>
    <button class="type-btn" data-type="wasm">Wasm</button>
    <button class="type-btn" data-type="other">Other</button>
    <label class="invert-label">
      <input type="checkbox" id="invertFilter">
      Invert
    </label>
  </div>

  <div class="main-split" id="mainSplit">
    <div class="requests-container" id="requests">
      <div class="empty-state">
        Requests will appear here. Reload the page to capture traffic.
      </div>
    </div>

    <div class="preview-panel" id="previewPanel">
      <div class="preview-summary" id="previewSummary"></div>
      <div class="preview-tabs" id="previewTabs">
        <button class="preview-tab active" data-tab="payload">Payload</button>
        <button class="preview-tab" data-tab="response">Response</button>
        <button class="preview-tab" data-tab="headers">Headers</button>
      </div>
      <div class="preview-body" id="previewBody"></div>
    </div>
  </div>

  <div class="actions">
    <button id="copyBtn" disabled>Copy Selected</button>
    <button id="clearBtn" class="secondary">Clear List</button>
  </div>
  
  <script src="panel.js"></script>
</body>
</html>
